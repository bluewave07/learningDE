name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: mkdir _site && cp -r index.html manifest.webmanifest sw.js css js data icons _site/
      - name: Add generated audio (if available)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download audio -p audio-de.zip -D . -R "$GITHUB_REPOSITORY" 2>/dev/null; then
            mkdir -p _site/audio/de && unzip -q audio-de.zip -d _site/audio/de && echo "audio: $(ls _site/audio/de | wc -l) files"
          else echo "no audio release yet – the app falls back to the device voice"; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
